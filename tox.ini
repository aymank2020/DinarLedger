[tox]
envlist = py311, py312, lint, type-check
skip_missing_interpreters = true

[testenv]
deps =
    pytest>=8.0
    pytest-cov>=5.0
    hypothesis>=6.100
commands =
    pytest --cov=dinarledger --cov-report=term-missing {posargs}

[testenv:lint]
deps =
    ruff>=0.8.0
    black>=24.0
commands =
    ruff check src/dinarledger
    black --check src/dinarledger

[testenv:type-check]
deps =
    mypy>=1.8
commands =
    mypy src/dinarledger
